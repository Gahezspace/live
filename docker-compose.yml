# live.gahez.space on the shared server. Publishes no ports: the Caddy proxy
# in /srv/proxy reaches it over `edge` as live-web.
#
#   cd /srv/live && docker compose up -d --build
#
# .env holds RESEND_API_KEY for the waiting-list emails. It lives only on the
# server; without it the form answers "not configured" instead of failing.
services:
  web:
    build: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    networks:
      edge:
        aliases: [live-web]
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  edge:
    external: true
