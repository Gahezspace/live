kind = "web"
previewPath = "/"
title = "Jahiz Live"
description = "A polished Arabic-first live learning platform where students discover live classes, upcoming premieres, and expert teachers, while keeping the energetic personality of a real classroom."
version = "1.0.0"
id = "artifacts/jahez-live"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20765

[services.development]
run = "pnpm --filter @workspace/jahez-live run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/jahez-live", "run", "build" ]
serve = "static"
publicDir = "artifacts/jahez-live/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20765"
BASE_PATH = "/"
